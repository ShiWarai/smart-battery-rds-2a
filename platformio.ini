; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = battery-wokwi
extra_configs = secret_values.ini

[base]
    framework = arduino
    platform = espressif32
    board = seeed_xiao_esp32c3
    board_build.partitions = partion_table.csv
    monitor_speed = 115200

    lib_compat_mode = strict
    lib_deps =
        ArduinoJson
        ayushsharma82/ElegantOTA@^3.1.6
        https://github.com/mathieucarbou/ESPAsyncWebServer#v3.3.11
        https://github.com/mathieucarbou/AsyncTCP#v3.2.6
        https://github.com/RobTillaart/INA226
        https://github.com/olikraus/U8g2_Arduino
        https://github.com/GyverLibs/EncButton
        https://github.com/tobiasschuerg/InfluxDB-Client-for-Arduino

    build_unflags =
        -std=gnu++11

    build_flags =
        ${secrets.build_flags}
        -std=c++17
        -std=gnu++17

        ; Опциональные настройки
        -D MS_MEASUREMENTS_ENABLE

        ; Hardware
        '-D BUZZER_PIN = D10'
        '-D BUTTONS_PIN = D2'
        '-D OLED_PWR_PIN = D9'
        '-D OLED_SCL = D5'
        '-D OLED_SDA = D4'
        
        ; Настройки сети
        '-D TZ_INFO="UTC-3"'
        -D PORT=80
        -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
        '-D HOSTNAME="https://rtuitlab.dev/"'
        '-D INFLUXDB_URL="http://82.97.246.60:8086"'
        '-D INFLUXDB_ORG="a9a0c23e8f3b54db"'
        '-D INFLUXDB_BUCKET="batteries"'

        ; Название областей постоянной памяти
        '-D SETTINGS_SPACE_NAME="pref"'
        '-D TESTING_SPACE_NAME="testing"'

        ; Прочие настройки
        -D ASYNCWEBSERVER_REGEX=1
        -D CORE_DEBUG_LEVEL=0 ; Для отключение логов


[env:test_board]
    extends = base
    build_type = debug

    build_unflags =
        ${base.build_unflags}

    build_flags = 
        ${base.build_flags}
        -D ID=3
        
        ; Hardware
        '-D SHUNT_MULTIPLIER_RESISTANCE=2.5'
        -D WOKWI


[env:battery-old]
    extends = base
    build_type = debug

    build_unflags =
        ${base.build_unflags}

    build_flags = 
        ${base.build_flags}
        -D ID=4

        ; Hardware
        '-D SHUNT_MULTIPLIER_RESISTANCE=2.5'


[env:battery-wokwi]
    extends = base
    build_type = debug

    build_unflags =
        ${base.build_unflags}

    build_flags = 
        ${base.build_flags}
        -D ID=9

        ; Hardware
        '-D SHUNT_MULTIPLIER_RESISTANCE=2.37'
        -D WITH_DISPLAY
        -D WOKWI

        ; Настройки сети
        '-D WIFI_SSID="Wokwi-GUEST"'
        '-D WIFI_PASSWORD=""'

        ; Прочее
        -D LOG_LOCAL_LEVEL=ESP_LOG_VERBOSE

[env:battery-debug]
    extends = base
    build_type = debug
    monitor_filters = esp32_exception_decoder

    build_unflags =
        ${base.build_unflags}

    build_flags = 
        ${base.build_flags}
        -D ID=2

        ; Опциональные настройки
        ;'-UMS_MEASUREMENTS_ENABLE'

        ; Hardware
        '-D SHUNT_MULTIPLIER_RESISTANCE=2.37'
        -D WITH_DISPLAY

        ; Прочее
        -D LOG_LOCAL_LEVEL=ESP_LOG_VERBOSE

[env:battery]
    extends = base
    build_type = release

    build_unflags =
        ${base.build_unflags}

    build_flags = 
        ${base.build_flags}
        -D ID=1
        -w

        ; Hardware
        '-D SHUNT_MULTIPLIER_RESISTANCE=2.3'
        -D WITH_DISPLAY

        ; Прочее
        -D LOG_LOCAL_LEVEL=ESP_LOG_INFO

